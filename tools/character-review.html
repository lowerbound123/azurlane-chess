<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Spine 舰船动作验收</title><style>body{margin:0;background:#102b40;color:#e6f2f4;font:16px system-ui}header{padding:24px}button{margin:6px;padding:10px 18px;background:#346175;color:white;border:1px solid #81bebe;border-radius:8px}#view{height:65vh}#status{padding:8px 24px}</style><header><h1>舰船角色 · Spine 3.8.99</h1><p>默认水手占位素材｜待机、移动、鱼雷、射炮、受击、舰载机</p><nav id="actions"></nav></header><div id="view"></div><p id="status">加载角色素材…</p><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {CharacterLibrary,ShipCharacter} from '/src/characters/spine.ts';
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,1,.1,100);camera.position.set(0,2.5,7);camera.lookAt(0,.8,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setClearColor(0x17364d);const host=document.querySelector('#view');host.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.8,0);controls.update();
const library=new CharacterLibrary({source:true}),actors=[-1.5,0,1.5].map((x,i)=>{const a=new ShipCharacter(library,'default',[0x70dfd5,0xf39179,0xedc274][i]);a.root.position.x=x;scene.add(a.root);return a;});
let sequence=0;for(const [key,name] of Object.entries({idle:'待机',move:'移动',torpedo:'发射鱼雷',fire:'射炮',hit:'受击',aircraft:'放飞舰载机'})){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{for(const actor of actors)actor.setAction(key,String(++sequence));document.querySelector('#status').textContent='当前动作：'+name;};document.querySelector('#actions').append(b);}
Promise.all(actors.map(a=>a.ready)).then(()=>document.querySelector('#status').textContent=actors.every(a=>a.mesh)?'3 个角色加载成功 · 可旋转镜头检查朝向':'使用后备占位，请检查控制台');
function resize(){renderer.setSize(host.clientWidth,host.clientHeight);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();}resize();addEventListener('resize',resize);let last=0;renderer.setAnimationLoop(t=>{for(const a of actors)a.tick((t-last)/1000,camera);last=t;renderer.render(scene,camera);});addEventListener('pagehide',()=>{renderer.setAnimationLoop(null);actors.forEach(a=>a.dispose());library.dispose();controls.dispose();renderer.dispose();});
</script></html>
